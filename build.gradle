plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex("net\\.runelite.*") }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'compass.OsrsStrategistPluginTest'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.udderlywet'
version = '0.2.0'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

def catalogGsonTestAgent = tasks.register('catalogGsonTestAgent', Jar) {
    dependsOn testClasses
    archiveFileName = 'catalog-gson-test-agent.jar'
    destinationDirectory = layout.buildDirectory.dir('test-agent')
    from(sourceSets.test.output) {
        include 'compass/CatalogGsonTestAgent.class'
    }
    manifest {
        attributes 'Premain-Class': 'compass.CatalogGsonTestAgent'
    }
}

test {
    dependsOn catalogGsonTestAgent
    jvmArgs "-javaagent:${layout.buildDirectory.file(
            'test-agent/catalog-gson-test-agent.jar').get().asFile}"
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}

tasks.register('contentCensus', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'compass.ContentCensusReporter'
}

tasks.register('contentCensusSummary', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'compass.ContentCensusReporter'
    args '--summary'
}
